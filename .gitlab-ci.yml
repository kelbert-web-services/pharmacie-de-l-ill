variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build

build-site:
  image: alpine:3.19
  stage: build
  script:
    - mkdir -p pharmacie-de-l-ill
    - cp -r sources/. pharmacie-de-l-ill/
  artifacts:
    name: "site-$CI_COMMIT_REF_SLUG"
    paths:
      - pharmacie-de-l-ill/
    expire_in: 3 months
